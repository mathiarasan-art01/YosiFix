{% extends "base.html" %}
{% block title %}New Idea — YosiFix{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="glass-card">
      <h3 class="mb-1">{{ t('nav_new_idea', lang) }}</h3>
      <p class="text-muted-custom mb-4">One or two sentences is enough — YosiFix will classify, research, and analyze it for you.</p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Title (optional)</label>
          <input type="text" name="title" class="form-control" placeholder="A short name for this idea">
        </div>
        <div class="mb-3">
          <label class="form-label">{{ t('label_idea_text', lang) }}</label>
          <textarea name="idea_text" class="form-control" rows="6" required
            placeholder="e.g. A mobile app that helps farmers detect crop diseases early using photos taken on their phone, and connects them to nearby agri-input suppliers for treatment."></textarea>
        </div>
        <div class="mb-4">
          <label class="form-label">{{ t('label_language', lang) }}</label>
          <select name="language" class="form-select" style="max-width: 220px;">
            <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
            <option value="ta" {% if lang == 'ta' %}selected{% endif %}>தமிழ்</option>
            <option value="hi" {% if lang == 'hi' %}selected{% endif %}>हिन्दी</option>
          </select>
        </div>
        <button type="submit" class="btn btn-brand btn-lg">
          <i class="bi bi-magic"></i> {{ t('btn_analyze', lang) }}
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
