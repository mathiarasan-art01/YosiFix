{% extends "base.html" %}
{% block title %}Login — YosiFix{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="glass-card">
      <h3 class="mb-4">{{ t('nav_login', lang) }}</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input type="text" name="identifier" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">{{ t('nav_login', lang) }}</button>
      </form>
      <p class="text-center mt-3 mb-0">
        <small>No account yet? <a href="{{ url_for('auth.register') }}">{{ t('nav_register', lang) }}</a></small>
      </p>
    </div>
  </div>
</div>
{% endblock %}
